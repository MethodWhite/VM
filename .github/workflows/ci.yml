name: CI

on:
  push:
    branches: [ release, main, master, develop ]
  pull_request:
    branches: [ release, main, master, develop ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    timeout-minutes: 120
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev ccache

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install openssl ccache

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install openssl -y --no-progress
        "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DVESTA_BUILD_STDLIB=ON \
          -DVESTA_BUILD_EXAMPLES=ON

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DVESTA_BUILD_STDLIB=ON -DVESTA_BUILD_EXAMPLES=ON

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release --parallel

    - name: Run tests (Linux/macOS)
      if: runner.os != 'Windows'
      working-directory: build
      run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }} --parallel

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      working-directory: build
      run: ctest --output-on-failure -C Release --parallel

    - name: Lint check (Linux)
      if: runner.os == 'Linux'
      run: |
        # Code style: clang-format check on modified files
        CLANG_FORMAT=$(which clang-format-18 2>/dev/null || which clang-format 2>/dev/null || echo "")
        if [ -n "$CLANG_FORMAT" ]; then
          git fetch origin ${{ github.base_ref || 'release' }} --depth=1 2>/dev/null || true
          BASE="${GITHUB_BASE_REF:-origin/release}"
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE" -- '*.cpp' '*.h' 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs -I{} sh -c '$CLANG_FORMAT --dry-run --Werror {} 2>/dev/null || echo "Style issue in {}"'
          fi
        else
          echo "clang-format not installed, skipping style check"
        fi

    - name: Check for debug leftovers
      if: runner.os == 'Linux'
      run: |
        FOUND=$(grep -rn "FIXME\|HACK\|XXX" src/ --include="*.cpp" --include="*.h" 2>/dev/null | grep -v ".o.d\|.o$" | head -20 || true)
        if [ -n "$FOUND" ]; then
          echo "⚠️ Debug leftovers found:"
          echo "$FOUND"
        else
          echo "No debug leftovers found"
        fi

  # ----------------------------------------------------------------------
  # FreeBSD (BSD portability).  Corre dentro de una VM de FreeBSD porque
  # GitHub no ofrece runners nativos de BSD.
  # ----------------------------------------------------------------------
  freebsd:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    name: Build and test (FreeBSD)
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build and test on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: pkg install -y cmake ninja ccache
        run: |
          set -e
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DVESTA_BUILD_STDLIB=ON -DVESTA_BUILD_EXAMPLES=ON
          cmake --build build --parallel
          cd build && ctest --output-on-failure --parallel

  # ----------------------------------------------------------------------
  # Static analysis (Linux): cppcheck + clang-tidy on the main binary.
  # No bloquea el merge (informative), los warnings reales se revisan.
  # ----------------------------------------------------------------------
  static-analysis:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DVESTA_BUILD_STDLIB=ON

    - name: Run cppcheck
      continue-on-error: true
      run: |
        cppcheck --enable=warning,performance,portability \
          --std=c++17 --language=c++ --quiet \
          --suppress=missingIncludeSystem \
          -I include -I src \
          src/ 2>&1 | tee cppcheck.log
        echo "cppcheck exit: ${PIPESTATUS[0]}"
        # El job es informativo; el CI principal (build+tests) es el gate.

  # S-10 DevSecOps: fuzzing del JIT en CI.  Genera programas Vex aleatorios
  # y compara interp vs JIT para detectar bugs de correccion/crash del codegen.
  # Bloqueante: cualquier divergencia nueva del JIT falla el pipeline.
  jit-fuzz:
    name: JIT fuzz (S-10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build vm
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVESTA_BUILD_STDLIB=ON
          cmake --build build --target vm --parallel 2

      - name: Run JIT fuzzer (40 iters, semilla fija)
        run: |
          python3 tools/jit_fuzzer.py ./build/vm --iters 40 --seed 9 --timeout 15 --no-slots --out /tmp/fuzz_ci
          if ls /tmp/fuzz_ci/*.vex 2>/dev/null | grep -q .; then
            echo "::error::El fuzzer encontro bugs del JIT. Revisar /tmp/fuzz_ci/"
            exit 1
          fi
        timeout-minutes: 10

  # S-22 testing-quality / mini-ASA: verificar que el asm emitido por el JIT
  # es semanticamente equivalente al IR (cada op IR -> instruccion nativa,
  # no CALL a vmath).  Falla si hay un gap de EQUIVALENCIA (op IR sin nativa).
  # Los gaps de eficiencia (movq round-trip FP) se reportan como aviso, no
  # bloquean (es el gap conocido del FP, no un bug de correccion).
  ir-asm-equivalence:
    name: IR<->asm equivalence (S-22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build vm
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVESTA_BUILD_STDLIB=ON
          cmake --build build --target vm --parallel 2

      - name: Run IR<->asm equivalence check
        run: |
          python3 tools/ir_asm_equivalence.py ./build/vm 2>&1 | tee /tmp/asa.log
          if grep -qE '\[equivalencia' /tmp/asa.log; then
            echo "::error::Gap de equivalencia IR->asm detectado (op sin nativa)"
            exit 1
          fi
          echo "OK: sin gaps de equivalencia (los de eficiencia son avisos)"
        timeout-minutes: 10

  # S-22 testing-quality: coverage gate.  Compila con --coverage, corre los
  # tests CTest, genera reporte de cobertura (gcovr) y valida un umbral de
  # linea sobre el VM core.  Coverage gate bloqueante (el estandar exige
  # umbral minimo).
  coverage:
    name: Coverage gate (S-22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr

      - name: Configure with coverage
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DVESTA_BUILD_STDLIB=ON \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests (collect coverage)
        run: |
          cd build
          ctest --output-on-failure --parallel 2 || true
          cd ..

      - name: Coverage gate
        run: |
          gcovr --root . --filter 'src/(runtime|ir|jit|gc)/' \
            --xml-pretty -o coverage.xml --fail-under-line 15
          echo "coverage report OK"
