name: CI

on:
  push:
    branches: [ release, main, master, develop ]
  pull_request:
    branches: [ release, main, master, develop ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
      continue-on-error: true

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev ccache

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install openssl ccache

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install openssl -y --no-progress
        "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DVESTA_BUILD_STDLIB=ON \
          -DVESTA_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }} --parallel

    - name: Lint check (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "Lint check skipped - vexfmt not available in CI"
        # vexfmt --check .
