<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - VexDoc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2><a href="index.html">VexDoc</a></h2>
            </div>
            <div class="sidebar-search">
                <input type="text" id="search-input" placeholder="Search..." oninput="searchDocs(this.value)">
            </div>
            <ul class="sidebar-modules">
                {{sidebar_modules}}
            </ul>
        </nav>
        <main id="content">
            {{content}}
        </main>
    </div>
    <div id="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">&#9790;</span>
    </div>
    <script src="search.js"></script>
</body>
</html>
